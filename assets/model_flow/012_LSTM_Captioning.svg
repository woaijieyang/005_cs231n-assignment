<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#496b77"/></marker></defs><rect width="1100" height="300" fill="#fafaf7"/><text x="25" y="34" font-size="22" fill="#123841">一个 LSTM 时间步同时传递 h 和 c</text><path d="M205 90 H265" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M475 89 H505 V173 H535" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M205 205 H515 V192 H535" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M775 181 H850" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M475 79 H958 V153" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="62" width="185" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="112.5" y="83" text-anchor="middle" font-size="15" fill="#18343e">词嵌入 xₜ</text><text x="112.5" y="103" text-anchor="middle" font-size="15" fill="#18343e">上一隐藏状态 hₜ₋₁</text><rect x="265" y="62" width="210" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="370.0" y="83" text-anchor="middle" font-size="15" fill="#18343e">线性变换后分四块</text><text x="370.0" y="103" text-anchor="middle" font-size="15" fill="#18343e">i、f、o、g</text><rect x="20" y="178" width="185" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="112.5" y="199" text-anchor="middle" font-size="15" fill="#18343e">上一细胞状态</text><text x="112.5" y="219" text-anchor="middle" font-size="15" fill="#18343e">cₜ₋₁</text><rect x="535" y="153" width="240" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="655.0" y="174" text-anchor="middle" font-size="15" fill="#18343e">保留旧记忆并写入候选</text><text x="655.0" y="194" text-anchor="middle" font-size="15" fill="#18343e">cₜ = f·cₜ₋₁ + i·g</text><rect x="850" y="153" width="220" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="960.0" y="174" text-anchor="middle" font-size="15" fill="#18343e">暴露隐藏状态</text><text x="960.0" y="194" text-anchor="middle" font-size="15" fill="#18343e">hₜ = o·tanh(cₜ)</text><text x="25" y="273" font-size="15" fill="#344e57">反向先合并未来的 dc 与由 hₜ 传回的梯度，再分别传到遗忘门、输入门和候选内容。</text></svg>