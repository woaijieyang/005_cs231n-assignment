<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#496b77"/></marker></defs><rect width="1100" height="300" fill="#fafaf7"/><text x="25" y="34" font-size="22" fill="#123841">一次对抗更新中，同一个生成器参与两条不同路径</text><path d="M210 85 H250 V50 H670 V59" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M210 193 H248 V97 H292" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M477 93 H552" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M210 199 H292" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M477 205 H552" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><path d="M787 205 H850" fill="none" stroke="#496b77" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="57" width="190" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="115.0" y="78" text-anchor="middle" font-size="15" fill="#18343e">真实 MNIST 图像</text><text x="115.0" y="98" text-anchor="middle" font-size="15" fill="#18343e">目标标签 1</text><rect x="20" y="170" width="190" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="115.0" y="191" text-anchor="middle" font-size="15" fill="#18343e">噪声 z → G(z)</text><text x="115.0" y="211" text-anchor="middle" font-size="15" fill="#18343e">生成一批假图</text><rect x="292" y="65" width="185" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="384.5" y="86" text-anchor="middle" font-size="15" fill="#18343e">假图 detach</text><text x="384.5" y="106" text-anchor="middle" font-size="15" fill="#18343e">目标标签 0</text><rect x="552" y="59" width="235" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="669.5" y="80" text-anchor="middle" font-size="15" fill="#18343e">判别器 D 的真假损失</text><text x="669.5" y="100" text-anchor="middle" font-size="15" fill="#18343e">更新 D 的参数</text><rect x="292" y="177" width="185" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="384.5" y="198" text-anchor="middle" font-size="15" fill="#18343e">重新生成，保留计算图</text><text x="384.5" y="218" text-anchor="middle" font-size="15" fill="#18343e">目标标签 1</text><rect x="552" y="177" width="235" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="669.5" y="198" text-anchor="middle" font-size="15" fill="#18343e">经过 D 计算 G 的损失</text><text x="669.5" y="218" text-anchor="middle" font-size="15" fill="#18343e">梯度传回 G</text><rect x="850" y="177" width="218" height="55" rx="9" fill="#e6f0ed" stroke="#557985"/><text x="959.0" y="198" text-anchor="middle" font-size="15" fill="#18343e">生成器优化器 step</text><text x="959.0" y="218" text-anchor="middle" font-size="15" fill="#18343e">更新 G 的参数</text><text x="25" y="273" font-size="15" fill="#344e57">先完成上方的 D 更新，再执行下方的 G 更新。真假损失使用的标签、断开计算图的位置和更新对象均不同。</text></svg>